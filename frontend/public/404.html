<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>KALAM 2026</title>
  <script type="text/javascript">
    // Preserve requested route for React Router and redirect cleanly to root
    var fullPath = window.location.pathname + window.location.search + window.location.hash;
    sessionStorage.setItem('render_redirect', fullPath);
    window.location.replace('/');
  </script>
</head>
